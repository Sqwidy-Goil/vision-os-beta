<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>vis0n m0bil - Mixed Reality</title>
    <style>
        :root {
            --accent: #00d4ff;
            --bg: #050505;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Écran de démarrage obligatoire pour iOS */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: white;
            text-align: center;
        }
        .btn-start {
            padding: 20px 40px;
            font-size: 1.2rem;
            background: var(--accent);
            border: none;
            border-radius: 30px;
            color: black;
            font-weight: bold;
            box-shadow: 0 0 20px var(--accent);
            margin-top: 20px;
        }
        /* HUD */
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid var(--accent);
            pointer-events: none;
        }
        .status {
            color: var(--accent);
            font-family: monospace;
            font-size: 0.9rem;
        }
        /* Overlay Caméra pour rendu texture */
        #camera-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Miroir */
            z-index: -1;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 style="font-size: 2.5rem; margin-bottom: 10px;">👁️ visi0n m0bil</h1>
        <p>Expérience de Réalité Mixte</p>
        <p style="font-size: 0.8rem; color: #888;">Le système va activer la caméra et le gyroscope.</p>
        <button class="btn-start" id="btn-launch">Démarrer l'expérience</button>
    </div>

    <div class="hud">
        <div class="status" id="status">Système : Initialisation...</div>
    </div>

    <video id="camera-video" autoplay playsinline muted></video>

    <!-- Bibliothèques -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        // --- Configuration ---
        const params = {
            cubeColor: 0x00d4ff,
            floorY: 0, // Le sol virtuel
            grabDistance: 0.05
        };

        let scene, camera, renderer, cube, floor;
        let hands, videoElement;
        let statusEl;
        let isGrabbing = false;

        const btnLaunch = document.getElementById('btn-launch');
        const statusDisplay = document.getElementById('status');

        // --- Initialisation ---
        async function init() {
            // 1. Scène
            scene = new THREE.Scene();
            
            // 2. Caméra
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 3); // Hauteur d'homme moyen
            
            // 3. Rendu avec Texture Vidéo
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // 4. Lumières
            const ambient = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambient);
            const point = new THREE.PointLight(0x00d4ff, 1.5);
            point.position.set(2, 3, 2);
            scene.add(point);

            // 5. Objets
            // Sol (invisible mais sert de collision)
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, transparent: true, opacity: 0.3 });
            floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Le Cube de Réalité Mixte
            const cubeGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const cubeMat = new THREE.MeshStandardMaterial({ 
                color: params.cubeColor,
                metalness: 0.7,
                roughness: 0.2,
                emissive: 0x00d4ff,
                emissiveIntensity: 0.5
            });
            cube = new THREE.Mesh(cubeGeo, cubeMat);
            cube.position.set(0, 1, -2);
            scene.add(cube);

            // 6. Texture Vidéo
            videoElement = document.getElementById('camera-video');
            const videoTexture = new THREE.VideoTexture(videoElement);
            videoTexture.colorSpace = THREE.ColorSpace.SRGB1;
            
            // On utilise un plan géant comme arrière-plan pour la vidéo
            const bgGeo = new THREE.PlaneGeometry(50, 50);
            const bgMat = new THREE.MeshBasicMaterial({ map: videoTexture });
            const background = new THREE.Mesh(bgGeo, bgMat);
            background.position.z = -1; // Juste derrière le contenu 3D
            scene.add(background);

            statusEl = document.getElementById('status');
            statusEl.innerText = "Système : Caméra active...";

            setupMediaPipe();
            setupGyro();
            animate();
        }

        // --- Gyroscope ---
        function setupGyro() {
            window.addEventListener('deviceorientation', (e) => {
                if (e.beta !== null) {
                    // Rotation douce pour imiter la vision MR
                    camera.rotation.x = -e.beta * (Math.PI / 180);
                    camera.rotation.y = -e.gamma * (Math.PI / 180);
                    camera.rotation.z = -(e.alpha * (Math.PI / 180));
                }
            }, true);
        }

        // --- MediaPipe Hands ---
        function setupMediaPipe() {
            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.7
            });

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    
                    // Détection de "Pincement" (Index + Pouce)
                    const indexTip = landmarks[8];
                    const thumbTip = landmarks[4];
                    const distance = Math.sqrt(
                        Math.pow(indexTip.x - thumbTip.x, 2) + 
                        Math.pow(indexTip.y - thumbTip.y, 2)
                    );

                    if (distance < 0.06) {
                        isGrabbing = true;
                        statusEl.innerText = "Action : Objet saisi";
                        cube.material.emissive.setHex(0xff0000);
                    } else {
                        isGrabbing = false;
                        cube.material.emissive.setHex(params.neon);
                        
                        // Si on ne tient pas le cube, il retombe sur le sol
                        if (cube.position.y > params.floorY) {
                            cube.position.y = params.floorY;
                        }
                    }

                    if (isGrabbing) {
                        // On projette la position de la main vers le monde 3D
                        // Le Z est inversé car la caméra est face à nous
                        cube.position.x = (indexTip.x - 0.5) * 10;
                        cube.position.y = (-(indexTip.y - 0.5) * 10) + 1.6;
                        cube.position.z = -indexTip.z * 10; 
                    }
                } else {
                    statusEl.innerText = "Système : En attente de main...";
                    isGrabbing = false;
                }
            });

            const camHelper = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 1280,
                height: 720
            });
            camHelper.start();
        }

        // --- Boucle d'Animation ---
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotation lente pour rendre le menu vivant
            if (floatingMenu) {
                floatingMenu.rotation.y += 0.005;
                floatingMenu.position.y = 3 + Math.sin(Date.now() * 0.002) * 0.2;
            }

            renderer.render(scene, camera);
        }

        // --- Lancement ---
        btnLaunch.addEventListener('click', () => {
            document.getElementById('overlay').style.display = 'none';
            init();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
