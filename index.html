<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>VISI0N SPATIAL</title>
<meta name="description" content="A spatial computing environment for iPhone — Liquid Glass, floating windows, camera, orientation tracking.">
<meta name="theme-color" content="#0b0d14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VISI0N">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles/main.css">
</head>
<body data-env="dark" data-quality="balanced">
  <!-- Ambient spatial background -->
  <div id="env-bg" aria-hidden="true">
    <div class="env-layer layer-a"></div>
    <div class="env-layer layer-b"></div>
    <div class="env-layer layer-c"></div>
    <div class="env-grain"></div>
  </div>

  <!-- Spatial stage : windows live here -->
  <main id="space" aria-label="Spatial environment">
    <div id="windows"></div>
    <div id="hand-cursor" hidden></div>
  </main>

  <!-- Top system bar -->
  <header id="statusbar" class="glass-chip">
    <span id="sb-title">VISI0N&nbsp;SPATIAL</span>
    <span class="sb-group">
      <span id="sb-track" class="sb-dot" title="Orientation tracking">◌</span>
      <span id="sb-cam"   class="sb-dot" title="Camera">◌</span>
      <span id="sb-net"   class="sb-dot" title="Network">◌</span>
      <span id="sb-clock"></span>
    </span>
  </header>

  <!-- Recenter + environment switcher -->
  <div id="env-rail">
    <button id="btn-recenter" class="glass-btn" title="Recenter view">⟳</button>
    <button id="btn-environments" class="glass-btn" title="Environments">◐</button>
    <button id="btn-settings" class="glass-btn" title="Settings">⚙</button>
  </div>

  <!-- Environment picker modal -->
  <div id="env-picker" class="glass-panel modal" hidden>
    <h3>Environment</h3>
    <div class="env-grid">
      <button data-env="dark">Dark Space</button>
      <button data-env="futuristic">Futuristic</button>
      <button data-env="light">Light Space</button>
      <button data-env="workspace">Workspace</button>
    </div>
  </div>

  <!-- Application dock -->
  <nav id="dock" class="glass-dock" aria-label="Application dock"></nav>

  <!-- Toasts / errors -->
  <div id="toasts" aria-live="polite"></div>

  <noscript><div class="noscript">VISI0N SPATIAL requires JavaScript.</div></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
