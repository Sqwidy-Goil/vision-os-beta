<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b1020">
  <title>visi0n m0bil — vidéo spatiale</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script defer src="main.js"></script>
</head>
<body>
  <main aria-label="Prototype de vidéo en réalité mixte">
    <video id="input-video" class="room-camera" playsinline muted aria-label="Caméra de la pièce"></video>
    <canvas id="hand-canvas" width="1280" height="720" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <section class="controls" aria-live="polite">
      <div class="eyebrow">VISI0N M0BIL · MR LAB</div>
      <h1><span aria-hidden="true">◉</span> écran spatial</h1>
      <div class="status-row"><span class="status-dot" aria-hidden="true"></span><span id="status">Prêt à activer la caméra</span></div>
    </section>

    <section class="ar-screen" id="ar-screen" aria-label="Écran vidéo spatial" hidden>
      <header class="screen-bar" id="screen-bar">
        <span class="grab-dots" aria-hidden="true">⠿</span>
        <span class="screen-name" id="screen-name">Vidéo importée</span>
        <button id="close-screen" class="icon-button" type="button" aria-label="Fermer la vidéo">×</button>
      </header>
      <div class="screen-content">
        <video id="uploaded-video" controls playsinline></video>
        <div class="empty-video" id="empty-video">Choisissez une vidéo pour créer un écran.</div>
      </div>
      <span class="resize-handle" id="resize-handle" aria-label="Redimensionner">↘</span>
      <span class="screen-depth" aria-hidden="true">ANCRAGE DE SESSION</span>
    </section>

    <div id="hand-cursor" class="hand-cursor" aria-hidden="true"></div>
    <p class="hint" id="gesture-hint">1. Activez la caméra · 2. Ajoutez une vidéo · 3. Pincez pour attraper la fenêtre.</p>
    <nav class="action-bar" aria-label="Commandes">
      <button class="camera-button" id="camera-button" type="button">Activer la caméra</button>
      <button class="upload-button" id="upload-button" type="button" disabled>＋ Ajouter une vidéo</button>
      <input id="video-file" type="file" accept="video/*" hidden>
    </nav>
  </main>
</body>
</html>
