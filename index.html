<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>vis0n m0bil - Mixed Reality Premium</title>
    <style>
        :root {
            --accent: #00d4ff;
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.1);
        }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Écran de démarrage */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a2e 0%, #050505 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: white;
            text-align: center;
        }
        .btn-start {
            padding: 20px 40px;
            font-size: 1.2rem;
            background: var(--accent);
            border: none;
            border-radius: 30px;
            color: black;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-start:active { transform: scale(0.95); }

        /* HUD Premium */
        .hud {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 100;
            background: blur(10px) var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .status {
            color: var(--accent);
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #camera-video {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: -1;
        }
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 style="font-size: 3rem; margin-bottom: 10px; font-weight: 800;">vis0n <span style="color: var(--accent);">m0bil</span></h1>
        <p style="opacity: 0.7;">Expérience de Réalité Mixte</p>
        <button class="btn-start" id="btn-launch">Démarrer l'expérience</button>
    </div>

    <div class="hud">
        <div class="status" id="status">Système : Initialisation...</div>
    </div>

    <video id="camera-video" autoplay playsinline muted></video>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        // --- Configuration ---
        const config = {
            bg: 0x050505,
            floorY: 0,
            lerpFactor: 0.15, // Fluidité du mouvement
            grabThreshold: 0.06
        };

        let scene, camera, renderer, cube, floor;
        let hands, videoElement, statusEl;
        let isGrabbing = false;
        let targetPos = new THREE.Vector3();

        const btnLaunch = document.getElementById('btn-launch');
        const statusDisplay = document.getElementById('status');

        async function init() {
            // Scene & Camera
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 3);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);
            const point = new THREE.PointLight(0x00d4ff, 2, 20);
            point.position.set(2, 3, 2);
            scene.add(point);

            // Objects
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, transparent: true, opacity: 0.4 });
            floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // The Premium Cube
            const cubeGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const cubeMat = new THREE.MeshStandardMaterial({ 
                color: 0x00d4ff,
                metalness: 0.9,
                roughness: 0.1,
                emissive: 0x00d4ff,
                emissiveIntensity: 0.4
            });
            cube = new THREE.Mesh(cubeGeo, cubeMat);
            cube.position.set(0, 1, -2);
            scene.add(cube);

            // Background Video Texture
            videoElement = document.getElementById('camera-video');
            const videoTexture = new THREE.VideoTexture(videoElement);
            videoTexture.colorSpace = THREE.ColorSpace.SRGB1;
            
            const bgGeo = new THREE.PlaneGeometry(50, 50);
            const bgMat = new THREE.MeshBasicMaterial({ map: videoTexture });
            const background = new THREE.Mesh(bgGeo, bgMat);
            background.position.z = -1;
            scene.add(background);

            statusEl = document.getElementById('status');
            statusEl.innerText = "Système : Caméra active...";

            setupMediaPipe();
            setupGyro();
            animate();
        }

        function setupGyro() {
            window.addEventListener('deviceorientation', (e) => {
                if (e.beta !== null) {
                    camera.rotation.x = -e.beta * (Math.PI / 180);
                    camera.rotation.y = -e.gamma * (Math.PI / 180);
                    camera.rotation.z = -(e.alpha * (Math.PI / 180));
                }
            }, true);
        }

        function setupMediaPipe() {
            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                minDetectionConfidence: 0.8,
                minTrackingConfidence: 0.8
            });

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    const indexTip = landmarks[8];
                    const thumbTip = landmarks[4];
                    const distance = Math.sqrt(
                        Math.pow(indexTip.x - thumbTip.x, 2) + 
                        Math.pow(indexTip.y - thumbTip.y, 2)
                    );

                    if (distance < config.grabThreshold) {
                        isGrabbing = true;
                        cube.material.emissive.setHex(0xff0000);
                        statusEl.innerText = "Action : Objet saisi";
                    } else {
                        isGrabbing = false;
                        cube.material.emissive.setHex(config.neon);
                        if (cube.position.y > config.floorY) {
                            cube.position.y = config.floorY;
                        }
                        statusEl.innerText = "Système : Prêt";
                    }

                    if (isGrabbing) {
                        // Mapping hand position to 3D space with smoothing
                        targetPos.x = (indexTip.x - 0.5) * 12;
                        targetPos.y = (-(indexTip.y - 0.5) * 10) + 1.6;
                        targetPos.z = -indexTip.z * 10;
                    }
                } else {
                    isGrabbing = false;
                    statusEl.innerText = "Système : En attente de main...";
                }
            });

            const camHelper = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 1280,
                height: 720
            });
            camHelper.start();
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Lerp Smoothing for premium feel
            if (isGrabbing) {
                cube.position.x += (targetPos.x - cube.position.x) * config.lerpFactor;
                cube.position.y += (targetPos.y - cube.position.y) * config.lerpFactor;
                cube.position.z += (targetPos.z - cube.position.z) * config.lerpFactor;
            }

            // Constant float animation
            if (!isGrabbing) {
                cube.position.y = config.floorY + 0.5 + Math.sin(Date.now() * 0.002) * 0.1;
                cube.rotation.y += 0.01;
            }

            renderer.render(scene, camera);
        }

        btnLaunch.addEventListener('click', () => {
            document.getElementById('overlay').style.display = 'none';
            init();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
